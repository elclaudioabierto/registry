version: "1"
name: "AgentKit Official Registry"
description: "Starter official recipes for browser automation"
recipes:
  - id: media-transcription
    kind: capability
    name: Media Transcription (ffmpeg + yt-dlp + faster-whisper)
    description: Download a YouTube video, extract audio, and run local transcription with faster-whisper.
    aliases: [video-transcribe, yt-transcribe]
    capabilities: [media, transcription]
    tags: [ffmpeg, yt-dlp, whisper, audio]
    path: recipes/media-transcription.yaml
  - id: fast-agent
    kind: package
    name: fast-agent
    description: Install fast-agent via uv tool (fast-agent-mcp).
    aliases: [fastagent, fast-agent.ai]
    capabilities: [agent-runtime, ai-tools]
    tags: [python, agents]
    path: recipes/fast-agent.yaml
  - id: tensorflow-cpu
    kind: capability
    name: TensorFlow (CPU)
    description: Install TensorFlow CPU in a local uv venv.
    aliases: [tf-cpu]
    capabilities: [ml, tensorflow]
    tags: [tensorflow, cpu]
    path: recipes/tensorflow-cpu.yaml
  - id: tensorflow-gpu
    kind: capability
    name: TensorFlow (GPU)
    description: Install TensorFlow GPU in a local uv venv.
    aliases: [tf-gpu]
    capabilities: [ml, tensorflow, gpu]
    tags: [tensorflow, gpu]
    path: recipes/tensorflow-gpu.yaml
  - id: presidio
    kind: capability
    name: Presidio (PII detection/redaction)
    description: Install Presidio analyzer + anonymizer in a local uv venv.
    aliases: [redaction, pii]
    capabilities: [redaction, privacy]
    tags: [presidio, pii]
    path: recipes/presidio.yaml
  - id: mediapipe
    kind: capability
    name: MediaPipe
    description: Install MediaPipe in a local uv venv.
    aliases: [computer-vision, cv]
    capabilities: [computer-vision]
    tags: [mediapipe, vision]
    path: recipes/mediapipe.yaml
  - id: markdown-pandoc
    kind: capability
    name: Markdown + Pandoc
    description: Install Pandoc for robust markdown conversion.
    aliases: [markdown]
    capabilities: [markdown, docs]
    tags: [pandoc]
    path: recipes/markdown-pandoc.yaml
  - id: latex
    kind: capability
    name: LaTeX
    description: Install MacTeX for LaTeX toolchain.
    aliases: [tex]
    capabilities: [latex, docs]
    tags: [latex]
    path: recipes/latex.yaml
  - id: nextjs-tailwind-ui
    kind: capability
    name: Next.js + Tailwind UI
    description: Scaffold a Next.js app with a Tailwind UI-style starter layout.
    aliases: [next-stack, next-ui]
    capabilities: [frontend-app]
    tags: [nextjs, tailwind, ui]
    path: recipes/nextjs-tailwind-ui.yaml
  - id: r
    kind: package
    name: R
    description: Install R and common packages for analysis on macOS.
    aliases: [r-lang, rstats]
    capabilities: [data-science, statistics]
    package: r
    tags: [r, statistics, data]
    path: recipes/r.yaml
  - id: chromium
    path: recipes/chromium.yaml
    name: Chromium
    description: Install and use Chromium automation
    aliases: [chrome, browser-chromium]
    capabilities: [browser, web-automation]
    package: playwright
    tags: [automation, browser]
  - id: puppeteer
    path: recipes/puppeteer.yaml
    name: Puppeteer
    description: Use Puppeteer for browser automation tasks
    aliases: [pptr]
    capabilities: [browser, web-automation]
    package: puppeteer
    tags: [automation, browser]
  - id: selenium
    path: recipes/selenium.yaml
    name: Selenium
    description: Use Selenium WebDriver automation
    aliases: [webdriver]
    capabilities: [browser, web-automation]
    package: selenium-webdriver
    tags: [automation, browser]
  - id: web-automation
    path: recipes/web-automation.yaml
    name: Web Automation Capability
    description: Capability recipe for common web automation setup
    aliases: [scrape]
    capabilities: [web-automation]
    tags: [capability]
sources: []
