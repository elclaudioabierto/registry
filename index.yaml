version: "1"
name: "AgentKit Official Registry"
description: "Starter official recipes for browser automation"
recipes:
  - id: nextjs-tailwind-ui
    kind: capability
    name: Next.js + Tailwind UI
    description: Scaffold a Next.js app with a Tailwind UI-style starter layout.
    aliases: [next-stack, next-ui]
    capabilities: [frontend-app]
    tags: [nextjs, tailwind, ui]
    path: recipes/nextjs-tailwind-ui.yaml
  - id: r
    kind: package
    name: R
    description: Install R and common packages for analysis on macOS.
    aliases: [r-lang, rstats]
    capabilities: [data-science, statistics]
    package: r
    tags: [r, statistics, data]
    path: recipes/r.yaml
  - id: chromium
    path: recipes/chromium.yaml
    name: Chromium
    description: Install and use Chromium automation
    aliases: [chrome, browser-chromium]
    capabilities: [browser, web-automation]
    package: playwright
    tags: [automation, browser]
  - id: puppeteer
    path: recipes/puppeteer.yaml
    name: Puppeteer
    description: Use Puppeteer for browser automation tasks
    aliases: [pptr]
    capabilities: [browser, web-automation]
    package: puppeteer
    tags: [automation, browser]
  - id: selenium
    path: recipes/selenium.yaml
    name: Selenium
    description: Use Selenium WebDriver automation
    aliases: [webdriver]
    capabilities: [browser, web-automation]
    package: selenium-webdriver
    tags: [automation, browser]
  - id: web-automation
    path: recipes/web-automation.yaml
    name: Web Automation Capability
    description: Capability recipe for common web automation setup
    aliases: [scrape]
    capabilities: [web-automation]
    tags: [capability]
sources: []
