kind: capability
id: faang-ai
name: FAANG AI Pack
description: Codex + Gemini + Claude Code CLIs.
aliases: [ai-pack]
capabilities: [ai, devtools]
steps:
  - title: Install Codex CLI
    type: install
    package: @openai/codex
    with:
      manager: npm
      name: @openai/codex
  - title: Install Gemini CLI
    type: install
    package: @google/gemini-cli
    with:
      manager: npm
      name: @google/gemini-cli
  - title: Install Claude Code
    type: install
    package: @anthropic-ai/claude-code
    with:
      manager: npm
      name: @anthropic-ai/claude-code
