kind: capability
id: media-toolkit
name: Media Toolkit
description: ffmpeg + yt-dlp + faster-whisper in a local uv venv.
aliases: [media, transcription]
capabilities: [media, transcription]
steps:
  - title: Install uv
    type: install
    package: uv
    with:
      manager: brew
      name: uv
  - title: Install ffmpeg
    type: install
    package: ffmpeg
    with:
      manager: brew
      name: ffmpeg
  - title: Install yt-dlp
    type: install
    package: yt-dlp
    with:
      manager: brew
      name: yt-dlp
  - title: Create .venv (uv)
    type: run
    command: uv venv .venv
  - title: Install faster-whisper
    type: run
    command: bash -lc "source .venv/bin/activate && uv pip install faster-whisper"
