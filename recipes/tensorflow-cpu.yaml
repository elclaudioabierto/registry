kind: capability
id: tensorflow-cpu
name: TensorFlow (CPU)
description: Install TensorFlow CPU in a local uv venv.
aliases: [tf-cpu]
capabilities: [ml, tensorflow]
steps:
  - title: Install uv
    type: install
    package: uv
    with:
      manager: brew
      name: uv
  - title: Create .venv (uv)
    type: run
    command: uv venv .venv
  - title: Install TensorFlow (CPU)
    type: run
    command: bash -lc "source .venv/bin/activate && uv pip install tensorflow"
