kind: capability
id: geospatial
name: Geospatial Stack
description: GDAL + QGIS + PostGIS + Python geospatial stack.
aliases: [gis]
capabilities: [geospatial]
steps:
  - title: Install GDAL
    type: install
    package: gdal
    with:
      manager: brew
      name: gdal
  - title: Install QGIS
    type: install
    package: qgis
    with:
      manager: brew
      name: --cask qgis
  - title: Install PostGIS
    type: install
    package: postgis
    with:
      manager: brew
      name: postgis
  - title: Install uv
    type: install
    package: uv
    with:
      manager: brew
      name: uv
  - title: Create .venv (uv)
    type: run
    command: uv venv .venv
  - title: Install Python geospatial stack
    type: run
    command: bash -lc "source .venv/bin/activate && uv pip install geopandas shapely rasterio pyproj folium"
