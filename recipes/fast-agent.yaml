kind: package
id: fast-agent
name: fast-agent
description: Install fast-agent via uv in a local .venv.
aliases: ["fastagent", "fast-agent.ai"]
capabilities: ["agent-runtime", "ai-tools"]
package: fast-agent
steps:
  - title: Create .venv (uv)
    type: run
    command: uv venv .venv
  - title: Install fast-agent (uv)
    type: run
    command: . .venv/bin/activate && uv pip install fast-agent
  - title: Verify install
    type: run
    command: . .venv/bin/activate && fast-agent --help
  - title: Reference
    type: open
    url: https://fast-agent.ai/
