kind: package
id: fast-agent
name: fast-agent
description: Install fast-agent via uv tool for agent workflows.
aliases: ["fastagent", "fast-agent.ai"]
capabilities: ["agent-runtime", "ai-tools"]
package: fast-agent-mcp
steps:
  - title: Install uv
    type: install
    package: uv
    with:
      manager: brew
      name: uv
  - title: Install fast-agent (uv tool)
    type: run
    command: uv tool install fast-agent-mcp
  - title: Verify install
    type: run
    command: fast-agent --help
  - title: Reference
    type: open
    url: https://fast-agent.ai/
