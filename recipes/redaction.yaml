kind: capability
id: redaction
name: Redaction Bundle
description: Presidio + spaCy + PDF tools for redaction.
aliases: [pii-redaction, presidio]
capabilities: [redaction, privacy]
steps:
  - title: Install uv
    type: install
    package: uv
    with:
      manager: brew
      name: uv
  - title: Create .venv (uv)
    type: run
    command: uv venv .venv
  - title: Install Presidio + spaCy
    type: run
    command: bash -lc "source .venv/bin/activate && uv pip install presidio-analyzer presidio-anonymizer spacy pikepdf"
  - title: Download spaCy model
    type: run
    command: bash -lc "source .venv/bin/activate && python -m spacy download en_core_web_lg"
