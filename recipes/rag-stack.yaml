kind: capability
id: rag-stack
name: RAG Stack
description: markitdown + chromadb + Next.js search UI + litestream.
aliases: [rag]
capabilities: [rag, search]
steps:
  - title: Install uv
    type: install
    package: uv
    with:
      manager: brew
      name: uv
  - title: Install Node.js
    type: install
    package: node
    with:
      manager: brew
      name: node
  - title: Install pnpm
    type: install
    package: pnpm
    with:
      manager: npm
      name: pnpm
  - title: Create .venv (uv)
    type: run
    command: uv venv .venv
  - title: Install markitdown + chromadb
    type: run
    command: bash -lc "source .venv/bin/activate && uv pip install markitdown chromadb"
  - title: Install Litestream
    type: install
    package: litestream
    with:
      manager: brew
      name: litestream
  - title: Scaffold Next.js search UI
    type: run
    command: pnpm dlx create-next-app@latest rag-search-ui --ts --tailwind --app --eslint
