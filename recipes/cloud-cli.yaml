kind: capability
id: cloud-cli
name: Cloud CLIs
description: Vercel + AWS CLI with verification.
aliases: [cloud]
capabilities: [cloud, devops]
steps:
  - title: Install Vercel CLI
    type: run
    command: npm install -g vercel
  - title: Install AWS CLI v2 (official installer)
    type: run
    command: |
      curl "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "AWSCLIV2.pkg"
      sudo installer -pkg AWSCLIV2.pkg -target /
  - title: Verify Vercel CLI
    type: run
    command: vercel --version
  - title: Verify AWS CLI
    type: run
    command: aws --version
