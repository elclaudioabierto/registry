kind: capability
id: cloud-cli
name: Cloud CLIs
description: Install Vercel CLI and AWS CLI.
aliases: [cloud]
capabilities: [cloud, devops]
steps:
  - title: Install Vercel CLI
    type: install
    package: vercel
    with:
      manager: npm
      name: vercel
  - title: Install AWS CLI v2
    type: install
    package: awscli@2
    with:
      manager: brew
      name: awscli@2
