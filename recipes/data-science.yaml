kind: capability
id: data-science
name: Data Science Stack
description: Jupyter + NumPy + pandas + matplotlib + seaborn.
aliases: [datasci]
capabilities: [data-science]
steps:
  - title: Install uv
    type: install
    package: uv
    with:
      manager: brew
      name: uv
  - title: Create .venv (uv)
    type: run
    command: uv venv .venv
  - title: Install data science stack
    type: run
    command: bash -lc "source .venv/bin/activate && uv pip install jupyter numpy pandas matplotlib seaborn"
