kind: capability
id: nextjs-tailwind-ui
name: Next.js + Tailwind UI
description: Scaffold a Next.js (App Router + TS + Tailwind) app with a rich Tailwind UI-style starter layout.
aliases: ["next-stack", "next-ui"]
capabilities: ["frontend-app"]
steps:
  - title: Create Next.js app (pnpm)
    type: run
    command: pnpm dlx create-next-app@latest <project-name> --ts --tailwind --app --eslint
  - title: Install dependencies
    type: run
    command: cd <project-name> && pnpm install
  - title: Add Tailwind UI-style starter layout
    type: run
    command: |
      cd <project-name> && cat > app/page.tsx <<'PAGE'
      export default function Home() {
        return (
          <main className="min-h-screen bg-white text-zinc-900">
            <header className="border-b border-zinc-200">
              <div className="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
                <div className="text-lg font-semibold">AgentKit</div>
                <nav className="hidden gap-6 text-sm md:flex">
                  <a className="hover:underline" href="#">Docs</a>
                  <a className="hover:underline" href="#">Registry</a>
                  <a className="hover:underline" href="#">Templates</a>
                  <a className="hover:underline" href="#">Support</a>
                </nav>
                <button className="rounded-md border border-zinc-300 px-3 py-1.5 text-sm">Get started</button>
              </div>
            </header>

            <section className="mx-auto grid max-w-6xl gap-10 px-6 py-12 md:grid-cols-2">
              <div>
                <p className="text-sm font-medium text-zinc-500">Capability Provisioning</p>
                <h1 className="mt-3 text-4xl font-semibold tracking-tight md:text-5xl">
                  Build agent-ready apps without guesswork.
                </h1>
                <p className="mt-4 text-base text-zinc-600">
                  AgentKit turns messy setup into deterministic recipes. Ship faster, waste fewer tokens.
                </p>
                <div className="mt-6 flex gap-3">
                  <button className="rounded-md bg-zinc-900 px-4 py-2 text-sm text-white">Install AgentKit</button>
                  <button className="rounded-md border border-zinc-300 px-4 py-2 text-sm">View docs</button>
                </div>
              </div>
              <div className="rounded-2xl border border-zinc-200 bg-zinc-50 p-6">
                <div className="grid gap-4">
                  {[
                    { title: 'Search', desc: 'Discover capabilities fast.' },
                    { title: 'Inspect', desc: 'See steps before running.' },
                    { title: 'Add', desc: 'Install with confidence.' }
                  ].map((card) => (
                    <div key={card.title} className="rounded-xl border border-zinc-200 bg-white p-4 shadow-sm">
                      <div className="text-sm font-semibold">{card.title}</div>
                      <div className="mt-1 text-sm text-zinc-600">{card.desc}</div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            <section className="border-t border-zinc-200 bg-zinc-50">
              <div className="mx-auto grid max-w-6xl gap-6 px-6 py-10 md:grid-cols-3">
                {[
                  'Deterministic installs',
                  'Agent-friendly outputs',
                  'Composable capabilities'
                ].map((item) => (
                  <div key={item} className="rounded-xl border border-zinc-200 bg-white p-4">
                    <div className="text-sm font-semibold">{item}</div>
                    <p className="mt-2 text-sm text-zinc-600">Built for AI coding workflows.</p>
                  </div>
                ))}
              </div>
            </section>
          </main>
        );
      }
      PAGE
  - title: Note about Tailwind UI
    type: note
    description: Tailwind UI components require a paid license; replace the layout with your licensed components.
