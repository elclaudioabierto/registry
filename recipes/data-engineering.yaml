kind: capability
id: data-engineering
name: Data Engineering Stack
description: DuckDB + dbt + PyArrow + Polars bundle.
aliases: [data-eng]
capabilities: [data]
steps:
  - title: Install DuckDB
    type: install
    package: duckdb
    with:
      manager: brew
      name: duckdb
  - title: Install uv
    type: install
    package: uv
    with:
      manager: brew
      name: uv
  - title: Create .venv (uv)
    type: run
    command: uv venv .venv
  - title: Install Python data tooling
    type: run
    command: bash -lc "source .venv/bin/activate && uv pip install dbt-core pyarrow polars"
