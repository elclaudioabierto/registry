kind: capability
id: media-transcription
name: Media Transcription (ffmpeg + yt-dlp + faster-whisper)
description: Download a YouTube video, extract audio, and run local transcription with faster-whisper.
aliases: [video-transcribe, yt-transcribe]
capabilities: [media, transcription]
steps:
  - title: Install ffmpeg
    type: install
    package: ffmpeg
    with:
      manager: brew
      name: ffmpeg
  - title: Install yt-dlp
    type: install
    package: yt-dlp
    with:
      manager: brew
      name: yt-dlp
  - title: Install uv
    type: install
    package: uv
    with:
      manager: brew
      name: uv
  - title: Create .venv (uv)
    type: run
    command: uv venv .venv
  - title: Install Python packages (uv)
    type: run
    command: . .venv/bin/activate && uv pip install faster-whisper spacy
  - title: Download test video
    type: run
    command: yt-dlp -o "myvideo.%(ext)s" https://www.youtube.com/watch?v=t9fM-cTVyTg
  - title: Transcribe with faster-whisper
    type: run
    command: . .venv/bin/activate && python -c "from faster_whisper import WhisperModel; model=WhisperModel('small'); segments,_=model.transcribe('myvideo.mp4'); [print(f'[{s.start:.2f}-{s.end:.2f}] {s.text}') for s in segments]"
