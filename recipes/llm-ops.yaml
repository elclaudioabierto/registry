kind: capability
id: llm-ops
name: LLM Ops Toolkit
description: Litellm + ragas + promptfoo tooling.
aliases: [llmops]
capabilities: [ai, evals]
steps:
  - title: Install uv
    type: install
    package: uv
    with:
      manager: brew
      name: uv
  - title: Create .venv (uv)
    type: run
    command: uv venv .venv
  - title: Install LLM tooling
    type: run
    command: bash -lc "source .venv/bin/activate && uv pip install litellm ragas"
  - title: Install Promptfoo
    type: install
    package: promptfoo
    with:
      manager: npm
      name: promptfoo
