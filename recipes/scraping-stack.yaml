kind: capability
id: scraping-stack
name: Scraping Stack
description: Playwright + BeautifulSoup + readability + requests.
aliases: [scrape-stack]
capabilities: [scraping, web-automation]
steps:
  - title: Install Playwright
    type: install
    package: playwright
    with:
      manager: npm
      name: playwright
  - title: Install Playwright browsers
    type: run
    command: npx playwright install
  - title: Install uv
    type: install
    package: uv
    with:
      manager: brew
      name: uv
  - title: Create .venv (uv)
    type: run
    command: uv venv .venv
  - title: Install Python scraping tools
    type: run
    command: bash -lc "source .venv/bin/activate && uv pip install beautifulsoup4 readability-lxml requests"
