id: web-automation
name: Web Automation Capability
description: Baseline setup recipe for web automation workflows
aliases: [scrape]
capabilities: [web-automation]
tags: [capability]
steps:
  - title: Install Chromium
    type: install
    package: chromium
    with:
      manager: brew
      name: chromium
  - title: Install Puppeteer
    type: install
    package: puppeteer
    with:
      manager: pnpm
      name: puppeteer
  - title: Configure bot safeguards
    type: check
    description: Confirm usage follows target site terms and robots directives
