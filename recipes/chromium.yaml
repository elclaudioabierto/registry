id: chromium
name: Chromium
description: Install Chromium for browser automation and headless testing.
aliases: [chrome, browser-chromium]
capabilities: [browser, web-automation]
package: playwright
tags: [automation, browser]
steps:
  - title: Install Playwright Chromium
    type: install
    package: playwright
    description: Install Playwright which bundles Chromium automation support
  - title: Verify Chromium binary
    type: run
    command: pnpm exec playwright install chromium
