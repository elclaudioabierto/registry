kind: capability
id: presidio
name: Presidio (PII detection/redaction)
description: Install Presidio analyzer + anonymizer for PII redaction.
aliases: [redaction, pii]
capabilities: [redaction, privacy]
steps:
  - title: Install uv
    type: install
    package: uv
    with:
      manager: brew
      name: uv
  - title: Create .venv (uv)
    type: run
    command: uv venv .venv
  - title: Install Presidio packages
    type: run
    command: bash -lc "source .venv/bin/activate && uv pip install presidio-analyzer presidio-anonymizer"
