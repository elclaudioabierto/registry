kind: capability
id: mediapipe
name: MediaPipe
description: Install MediaPipe in a local uv venv.
aliases: [computer-vision, cv]
capabilities: [computer-vision]
steps:
  - title: Install uv
    type: install
    package: uv
    with:
      manager: brew
      name: uv
  - title: Create .venv (uv)
    type: run
    command: uv venv .venv
  - title: Install MediaPipe
    type: run
    command: bash -lc "source .venv/bin/activate && uv pip install mediapipe"
